source = ~/.cache/wal/colors-hyprland.conf

general { 
   #grace = 2
   ignore_empty_input = true
}

background {
    path = /home/han/.cache/current_wallpaper.jpg
    color = $background
    blur_passes = 2
}

# ============================================================================
# Jam
# ============================================================================
label {
    text = <b>$TIME</b>
    font_family = JetBrains Mono
    font_size = 132
    color = $foreground
    halign = center
    valign = center
    position = 0, 200
}

# ============================================================================
# Input Password
# ============================================================================
input-field {
    placeholder_text = Password
    size = 10%, 5%
    outline_thickness = 1
    inner_color = rgba(0, 0, 0, 0.0) # no fill

    outer_color = $color11 $color14 45deg
    check_color = $color2 120deg
    fail_color = $color1 40deg

    font_color = $foreground
    fade_on_empty = true
    rounding = 100

    position = 0, 80
    halign = center
    valign = bottom
}

# ============================================================================
# Music Player Widget
# ============================================================================

# Kotak Latar Belakang Player
shape {
    monitor =
    color = rgba(0, 0, 0, 0.4) # Gelap transparan agar elegan
    size = 480, 120
    rounding = 15
    border_size = 1
    border_color = $foreground
    position = 0, 180
    halign = center
    valign = bottom
    zindex = 1
}

# Album Art
image {
    monitor =
    path = /tmp/empty.png # Placeholder default
    size = 90
    rounding = 5
    border_size = 0
    rotate = 0
    reload_time = 2
    reload_cmd = ~/.config/test-hypr/scripts/hyprlock-music.sh --art
    position = -170, 195
    halign = center
    valign = bottom
    zindex = 2
}

# Judul Lagu
label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/test-hypr/scripts/hyprlock-music.sh --title)"
    color = $foreground
    font_size = 13
    font_family = JetBrainsMono Nerd Font Mono Heavy
    position = 40, 270
    halign = center
    valign = bottom
    zindex = 2
}

# Nama Artis
label {
    monitor =
    text = cmd[update:1000] echo "󰠃  $(~/.config/test-hypr/scripts/hyprlock-music.sh --artist)"
    color = $foreground
    font_size = 11
    font_family = JetBrainsMono Nerd Font Mono Semibold
    position = 40, 250
    halign = center
    valign = bottom
    zindex = 2
}

# Posisi Waktu Berjalan
label {
    monitor = 
    text = cmd[update:1000] echo "$(~/.config/test-hypr/scripts/hyprlock-music.sh --position)"
    color = $foreground
    font_size = 10
    font_family = JetBrainsMono Nerd Font Mono
    position = -90, 225
    halign = center
    valign = bottom
    zindex = 2
}

# Progress Bar
label {
    monitor = 
    text = cmd[update:1000] ~/.config/test-hypr/scripts/hyprlock-music.sh --progress-bar
    color = $foreground
    font_size = 11
    font_family = JetBrainsMono Nerd Font Mono
    position = 40, 225
    halign = center
    valign = bottom
    zindex = 2
}

# Durasi Total Lagu
label {
    monitor = 
    text = cmd[update:1000] echo "$(~/.config/test-hypr/scripts/hyprlock-music.sh --length)"
    color = $foreground
    font_size = 10
    font_family = JetBrainsMono Nerd Font Mono
    position = 170, 225
    halign = center
    valign = bottom
    zindex = 2
}

# Kontrol: Previous
label {
    monitor =
    text = 󰒮
    color = $foreground
    font_size = 20
    onclick = playerctl previous
    position = -20, 190
    halign = center
    valign = bottom
    zindex = 2
}

# Kontrol: Play/Pause
label {
    monitor =
    text = cmd[update:1000] ~/.config/test-hypr/scripts/hyprlock-music.sh --status
    color = $foreground
    font_size = 22
    onclick = playerctl play-pause
    position = 40, 190
    halign = center
    valign = bottom
    zindex = 2
}

# Kontrol: Next
label {
    monitor =
    text = 󰒭
    color = $foreground
    font_size = 20
    onclick = playerctl next
    position = 100, 190
    halign = center
    valign = bottom
    zindex = 2
}

# Nama Player (Misal: Spotify)
label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/test-hypr/scripts/hyprlock-music.sh --player)"
    color = $foreground
    font_size = 11
    font_family = JetBrainsMono Nerd Font Mono Bold
    position = 180, 190
    halign = center
    valign = bottom
    zindex = 2
}